<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ФураЕдет — Личный кабинет</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: var(--navy); color: var(--fg-1); min-height: 100vh; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.16); }
  .wm { font-family: var(--font-display); letter-spacing: 0.1em; line-height: 1; }
  .wm .accent { color: var(--gold); }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }
  input::placeholder { color: rgba(255,255,255,0.3); }

  /* ───────── RESPONSIVE: TABLET (≤1024px) ───────── */
  @media (max-width: 1024px) {
    /* Sidebar → off-canvas */
    .r-sidebar { position: fixed !important; left: 0; top: 0; z-index: 100;
      transform: translateX(-100%); transition: transform 0.25s var(--ease-out);
    }
    .r-sidebar--open { transform: translateX(0) !important; box-shadow: 8px 0 32px rgba(0,0,0,0.5); }
    .r-sidebar-backdrop { display: block !important; }

    /* Topbar */
    .r-topbar { padding: 16px 20px !important; gap: 14px !important; flex-wrap: wrap !important; }
    .r-topbar h1 { font-size: 24px !important; }
    .r-menu-btn { display: inline-flex !important; }
    .r-search { width: 100% !important; order: 5 !important; flex: 1 0 100% !important; }

    /* Dashboard padding */
    main > div[style*="padding: 36"] { padding: 24px !important; }

    /* 4-col stat tiles → 2x2 */
    main div[style*="repeat(4"] { grid-template-columns: repeat(2, 1fr) !important; }

    /* 2fr/1.6fr/1.5fr/2fr 1fr two-col layouts → stack */
    main div[style*="2fr 1fr"],
    main div[style*="1.6fr 1fr"],
    main div[style*="1.5fr 1fr"],
    main div[style*="1.4fr 1fr"] {
      grid-template-columns: 1fr !important;
    }
  }

  /* ───────── RESPONSIVE: MOBILE (≤640px) ───────── */
  @media (max-width: 640px) {
    .r-sidebar { width: 84vw !important; max-width: 320px !important; }
    .r-topbar { padding: 12px 16px !important; gap: 10px !important; }
    .r-topbar h1 { font-size: 20px !important; }
    .r-topbar > button[style*="position: relative"][style*="width: 38px"] { display: none !important; }
    .r-roles { display: none !important; }
    .r-search { display: none !important; }

    /* Hide demo CTA button on phone (keep menu room) */
    .r-topbar > button[style*="background: var(--gold)"],
    .r-topbar > button:last-child { padding: 8px 14px !important; font-size: 10px !important; }

    /* Dashboard padding */
    main > div[style*="padding: 36"] { padding: 16px !important; gap: 16px !important; }

    /* 4-col stat tiles → 1col on phone */
    main div[style*="repeat(4"] { grid-template-columns: 1fr !important; }

    /* 2-col 1fr 1fr inner grids stay 2col on small phone? Stack for safety */
    main div[style*="repeat(2"] { grid-template-columns: 1fr !important; }
    main div[style*="gridTemplateColumns: '1fr 1fr'"],
    main div[style*='gridTemplateColumns: "1fr 1fr"'] { grid-template-columns: 1fr !important; }

    /* Tables horizontal scroll fallback */
    table { display: block; overflow-x: auto; }

    /* 8px·90px·1.4fr… Manager queue grid: stack as cards */
    main div[style*="8px 90px"] {
      grid-template-columns: 1fr 1fr !important;
      gap: 8px !important;
    }
  }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#0A1628">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0A1628"/>
    <rect x="0" y="0" width="240" height="800" fill="#101F36"/>
    <rect x="20" y="40" width="200" height="20" rx="4" fill="#F0A500" opacity="0.85"/>
    <rect x="20" y="100" width="160" height="10" rx="3" fill="#FFFFFF" opacity="0.3"/>
    <rect x="20" y="130" width="200" height="32" rx="6" fill="#F0A500" opacity="0.15"/>
    <rect x="32" y="142" width="120" height="8" rx="3" fill="#F0A500"/>
    <rect x="20" y="180" width="200" height="32" rx="6" fill="#FFFFFF" opacity="0.05"/>
    <rect x="32" y="192" width="100" height="8" rx="3" fill="#FFFFFF" opacity="0.5"/>
    <rect x="20" y="230" width="200" height="32" rx="6" fill="#FFFFFF" opacity="0.05"/>
    <rect x="32" y="242" width="140" height="8" rx="3" fill="#FFFFFF" opacity="0.5"/>
    <g font-family="Impact, 'Bebas Neue', sans-serif" font-weight="700" letter-spacing="6">
      <text x="700" y="380" font-size="84" text-anchor="middle" fill="#FFFFFF">КАБИНЕТ</text>
      <text x="700" y="470" font-size="48" text-anchor="middle" fill="#F0A500">ФУРАЕДЕТ</text>
    </g>
    <rect x="640" y="510" width="120" height="3" fill="#F0A500"/>
  </svg>
</template>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../shared/icons.jsx"></script>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Client.jsx"></script>
<script type="text/babel" src="Manager.jsx"></script>
<script type="text/babel" src="Admin.jsx"></script>

<script type="text/babel">
  const { Sidebar, Topbar, Btn, ClientDashboard, ManagerDashboard, AdminDashboard, Icon } = window;

  const NAV_BY_ROLE = {
    client: [
      { id: 'dashboard', label: 'Сводка', icon: <Icon.TrendingUp/> },
      { id: 'orders', label: 'Мои заявки', icon: <Icon.Package/>, badge: '3' },
      { id: 'new', label: 'Новая заявка', icon: <Icon.Plus/> },
      { id: 'tracking', label: 'Отслеживание', icon: <Icon.Map/> },
      { divider: 'Финансы', id: 'd1' },
      { id: 'invoices', label: 'Счета', icon: <Icon.Wallet/> },
      { id: 'docs', label: 'Документы', icon: <Icon.Edit/> },
      { divider: 'Аккаунт', id: 'd2' },
      { id: 'profile', label: 'Профиль', icon: <Icon.User/> },
      { id: 'support', label: 'Поддержка', icon: <Icon.Phone/> },
    ],
    manager: [
      { id: 'dashboard', label: 'Сводка', icon: <Icon.TrendingUp/> },
      { id: 'queue', label: 'Очередь заявок', icon: <Icon.Bell/>, badge: '12' },
      { id: 'active', label: 'В работе', icon: <Icon.Truck/> },
      { id: 'drivers', label: 'Водители', icon: <Icon.Users/> },
      { id: 'fleet', label: 'Автопарк', icon: <Icon.Truck/> },
      { divider: 'Клиенты', id: 'd1' },
      { id: 'clients', label: 'Клиентская база', icon: <Icon.User/> },
      { id: 'reports', label: 'Отчёты', icon: <Icon.Edit/> },
      { divider: 'Сервис', id: 'd2' },
      { id: 'settings', label: 'Настройки', icon: <Icon.Settings/> },
    ],
    admin: [
      { id: 'dashboard', label: 'Сводка', icon: <Icon.TrendingUp/> },
      { id: 'users', label: 'Пользователи', icon: <Icon.Users/>, badge: '14k' },
      { id: 'finance', label: 'Финансы', icon: <Icon.Wallet/> },
      { id: 'fleet', label: 'Автопарк', icon: <Icon.Truck/> },
      { id: 'tariffs', label: 'Тарифы', icon: <Icon.Edit/> },
      { divider: 'Система', id: 'd1' },
      { id: 'monitoring', label: 'Мониторинг', icon: <Icon.Cpu/> },
      { id: 'audit', label: 'Журнал событий', icon: <Icon.Eye/> },
      { id: 'roles', label: 'Роли и доступ', icon: <Icon.Shield/> },
      { divider: 'Сервис', id: 'd2' },
      { id: 'settings', label: 'Настройки', icon: <Icon.Settings/> },
    ],
  };

  const USER_BY_ROLE = {
    client:  { name: 'Алексей Петров',  email: 'a.petrov@khleb.ru',     initials: 'АП' },
    manager: { name: 'Елена Кузнецова',  email: 'e.kuz@furaedet.ru',     initials: 'ЕК' },
    admin:   { name: 'Игорь Захаров',    email: 'i.zakharov@furaedet.ru',initials: 'ИЗ' },
  };

  const TITLES = {
    client:  { sub: 'Клиентский кабинет',  title: 'Добро пожаловать, Алексей' },
    manager: { sub: 'Кабинет менеджера',   title: 'Операционная сводка' },
    admin:   { sub: 'Панель администратора',title: 'Состояние системы' },
  };

  function App() {
    const [role, setRole] = React.useState('client');
    const [active, setActive] = React.useState('dashboard');
    const [menuOpen, setMenuOpen] = React.useState(false);

    React.useEffect(() => { setActive('dashboard'); setMenuOpen(false); }, [role]);
    React.useEffect(() => { setMenuOpen(false); }, [active]);

    const Dashboard = role === 'admin' ? AdminDashboard : role === 'manager' ? ManagerDashboard : ClientDashboard;
    const action = role === 'client'
      ? <Btn icon={<Icon.Plus/>}>Новая заявка</Btn>
      : role === 'manager'
        ? <Btn icon={<Icon.Plus/>}>Назначить</Btn>
        : <Btn icon={<Icon.Plus/>}>Добавить пользователя</Btn>;

    return (
      <div data-screen-label="Cabinet" style={{ display: 'flex', minHeight: '100vh' }}>
        <Sidebar items={NAV_BY_ROLE[role]} activeId={active} onSelect={setActive} role={role} user={USER_BY_ROLE[role]}
          mobileOpen={menuOpen} onMobileClose={() => setMenuOpen(false)}/>
        <main style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column' }}>
          <Topbar
            title={TITLES[role].title}
            subtitle={TITLES[role].sub}
            role={role}
            onRoleChange={setRole}
            onMenu={() => setMenuOpen(true)}
            action={action} />
          <Dashboard/>
        </main>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
