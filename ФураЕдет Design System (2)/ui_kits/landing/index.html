<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ФураЕдет — Логистика нового поколения</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); background: var(--navy); color: var(--fg-1); min-height: 100vh; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

  @keyframes ticker { from { transform: translateX(0) } to { transform: translateX(-50%) } }
  @keyframes fadeUp { from { opacity:0; transform:translateY(24px) } to { opacity:1; transform:translateY(0) } }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .fade-in { animation: fadeUp 0.7s var(--ease-out) both; }

  /* Brand wordmark */
  .wm { font-family: var(--font-display); letter-spacing: 0.1em; line-height: 1; }
  .wm .accent { color: var(--gold); }

  /* Reusable */
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }

  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(240,165,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(240,165,0,0.03) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
  }

  /* ───────── RESPONSIVE: TABLET (≤1024px) ───────── */
  @media (max-width: 1024px) {
    .r-nav { padding: 0 24px !important; }
    .r-nav__links { display: none !important; }
    /* HERO */
    .r-hero__row { flex-direction: column !important; padding: 60px 40px 40px !important; gap: 48px !important; align-items: stretch !important; }
    .r-hero__calc-form { width: 100% !important; max-width: 520px !important; transform: rotate(0deg) !important; margin: 0 auto !important; }
    .r-hero__stats { flex-wrap: wrap !important; gap: 20px !important; }
    .r-hero__feat { padding: 0 !important; }

    /* Universal section padding compress */
    section { padding-left: 40px !important; padding-right: 40px !important; }
    section#why, section#fleet { padding: 0 !important; }

    /* Sections with 1fr 1fr or 1fr 1.4fr grids → stack */
    section#why { grid-template-columns: 1fr !important; }
    section#fleet { flex-direction: column !important; }
    section#fleet > div:first-child { padding: 60px 40px 40px !important; flex: 1 !important; }
    section#fleet > div:last-child { flex: 0 0 320px !important; min-height: 320px; }

    /* 4-col stat grids → 2x2 */
    section[style*="repeat(4"] > div,
    section > div[style*="repeat(4"] { grid-template-columns: repeat(2, 1fr) !important; }

    /* Stats cells: kill 4th col right-border, add bottoms for 2x2 */
    section > div[style*="repeat(4"] > div { border-right: none !important; }
    section > div[style*="repeat(4"] > div:nth-child(odd) { border-right: 1px solid rgba(0,0,0,0.08) !important; }
    section > div[style*="repeat(4"] > div:nth-child(-n+2) { border-bottom: 1px solid rgba(0,0,0,0.08) !important; }

    /* Process: 5 wide → too tight, but allow 5 still on tablet */

    /* 3-col grids (services / process) → keep 3 on tablet but tighter */
    /* will narrow on phone */

    /* Footer */
    .r-footer { padding: 64px 40px 28px !important; }
    .r-footer__grid { grid-template-columns: 1fr 1fr !important; gap: 40px !important; }

    h1, h2 { font-size: clamp(48px, 7vw, 72px) !important; }
  }

  /* ───────── RESPONSIVE: MOBILE (≤640px) ───────── */
  @media (max-width: 640px) {
    .r-nav { padding: 0 16px !important; }
    .r-nav__login { display: none !important; }
    section { padding-left: 20px !important; padding-right: 20px !important; padding-top: 64px !important; padding-bottom: 64px !important; }
    section#why, section#fleet { padding: 0 !important; }

    /* HERO */
    .r-hero { padding-top: 60px !important; min-height: auto !important; }
    .r-hero__row { padding: 40px 20px 32px !important; gap: 40px !important; }
    .r-hero__calc-form { padding: 28px 22px 24px !important; }
    .r-hero__stats { gap: 14px !important; padding-top: 24px !important; }
    .r-hero__stats > div:not([style*="width: 1px"]) { flex: 1 1 40% !important; min-width: 100px !important; }
    .r-hero__stats > div[style*="width: 1px"] { display: none !important; }
    .r-hero__feat { grid-template-columns: 1fr !important; }
    .r-hero__feat > div { border-right: none !important; border-bottom: 1px solid rgba(255,255,255,0.05) !important; padding: 16px 24px !important; }
    .r-hero__feat > div:last-child { border-bottom: none !important; }

    /* All multi-column grids → 1 col */
    section[style*="repeat(2"] > div,
    section[style*="repeat(3"] > div,
    section[style*="repeat(4"] > div,
    section > div[style*="repeat(2"],
    section > div[style*="repeat(3"],
    section > div[style*="repeat(4"] {
      grid-template-columns: 1fr !important;
    }

    /* WHY split & FLEET split: stack */
    section#why { grid-template-columns: 1fr !important; min-height: 0 !important; }
    section#why > div:first-child { height: 240px !important; }
    section#why > div:last-child { padding: 48px 24px !important; }

    section#fleet { flex-direction: column !important; min-height: 0 !important; }
    section#fleet > div:first-child { padding: 56px 24px !important; flex: 1 !important; }
    section#fleet > div:last-child { flex: 0 0 240px !important; min-height: 240px; }

    /* Stat cells: 4 → 2x2 with smaller numbers */
    section > div[style*="repeat(4"] > div {
      padding: 32px 20px !important;
      border-right: none !important;
      border-bottom: 1px solid rgba(0,0,0,0.08) !important;
    }
    section > div[style*="repeat(4"] > div:nth-child(2n) { border-right: none !important; }

    /* Display headlines smaller */
    h1, h2 { font-size: clamp(40px, 11vw, 64px) !important; letter-spacing: 1.5px !important; }
    h3 { font-size: clamp(22px, 6vw, 32px) !important; }

    /* Side-by-side header rows (title + paragraph) → stack */
    section > div[style*="space-between"][style*="flex-end"] { flex-direction: column !important; align-items: flex-start !important; gap: 24px !important; }

    /* Process: 5 steps in a row → 2 cols on phone */
    section#process > div[style*="display: flex"][style*="position: relative"] { flex-wrap: wrap !important; gap: 32px 0 !important; }
    section#process > div[style*="display: flex"][style*="position: relative"] > div { flex: 0 0 50% !important; }
    section#process > div[style*="display: flex"][style*="position: relative"] > div[style*="height: 1"] { display: none !important; }

    /* Inline h2 fontSize: 64 / 56 → smaller */
    h2[style*="fontSize: 64"], h2[style*="font-size: 64"],
    h2[style*="fontSize:64"],
    section h2 { font-size: clamp(40px, 11vw, 64px) !important; line-height: 0.95 !important; }

    /* Footer */
    .r-footer { padding: 56px 20px 24px !important; }
    .r-footer__grid { grid-template-columns: 1fr !important; gap: 36px !important; margin-bottom: 36px !important; }

    /* Generic 80px-pad sections fallback */
    section[style*="padding: 120px 80px"],
    section[style*="padding: 140px 80px"],
    section[style*="padding:'120px 80px"],
    section[style*="padding:'140px 80px"] { padding: 64px 20px !important; }
  }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#0A1628">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0A1628"/>
    <g stroke="#F0A500" stroke-opacity="0.08" stroke-width="1">
      <line x1="0" y1="200" x2="1200" y2="200"/>
      <line x1="0" y1="400" x2="1200" y2="400"/>
      <line x1="0" y1="600" x2="1200" y2="600"/>
      <line x1="300" y1="0" x2="300" y2="800"/>
      <line x1="600" y1="0" x2="600" y2="800"/>
      <line x1="900" y1="0" x2="900" y2="800"/>
    </g>
    <g font-family="Impact, 'Bebas Neue', sans-serif" font-weight="700" letter-spacing="8">
      <text x="600" y="380" font-size="120" text-anchor="middle" fill="#FFFFFF">ФУРА</text>
      <text x="600" y="500" font-size="120" text-anchor="middle" fill="#F0A500">ЕДЕТ</text>
    </g>
    <rect x="540" y="540" width="120" height="4" fill="#F0A500"/>
  </svg>
</template>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="../shared/icons.jsx"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Sections.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
  const { Nav, Hero, Ticker, Stats, Services, Why, Fleet, Process, Testimonials, CTA, Footer } = window;
  function App() {
    return (
      <div data-screen-label="Landing">
        <Nav />
        <Hero />
        <Ticker />
        <Stats />
        <Services />
        <Why />
        <Fleet />
        <Process />
        <Testimonials />
        <CTA />
        <Footer />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
