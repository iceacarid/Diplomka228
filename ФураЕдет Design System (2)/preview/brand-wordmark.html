<!doctype html>
<html><head><meta charset="utf-8"><title>Wordmark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--navy); padding: 28px; font-family: var(--font-body); display: flex; gap: 36px; align-items: center; }
  .mark { display: flex; flex-direction: column; line-height: 1; }
  .big { font-family: var(--font-display); font-size: 48px; letter-spacing: 4px; color: white; }
  .big .accent { color: var(--gold); }
  .sub { font-size: 9px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(240,165,0,0.55); margin-top: 4px; }
  .small { font-family: var(--font-display); font-size: 22px; letter-spacing: 2px; color: white; }
</style></head>
<body>
  <div class="mark"><span class="big">ФУРА<span class="accent">ЕДЕТ</span></span><span class="sub">Logistics</span></div>
  <div class="mark"><span class="small">ФУРА<span style="color:var(--gold)">ЕДЕТ</span></span></div>
</body></html>
