<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #FBF9F4; padding: 18px; }
  .row { display: flex; gap: 10px; }
  .swatch { flex: 1; border-radius: 10px; padding: 14px; height: 110px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-1); border: 1px solid var(--gray-1); }
  .swatch .name { font-family: var(--font-mono); font-size: 10px; font-weight: 600; }
  .swatch .hex { font-family: var(--font-mono); font-size: 11px; }
  .dark { color: var(--ink); }
  .light { color: var(--fg-1); }
</style></head>
<body>
  <div class="row">
    <div class="swatch dark" style="background:var(--white)"><span class="name">white</span><span class="hex">#FFFFFF</span></div>
    <div class="swatch dark" style="background:var(--off-white)"><span class="name">off-white</span><span class="hex">#F5F3EE</span></div>
    <div class="swatch dark" style="background:var(--gray-1)"><span class="name">gray-1</span><span class="hex">#E8E6E0</span></div>
    <div class="swatch light" style="background:var(--gray-2)"><span class="name">gray-2</span><span class="hex">#A8A49B</span></div>
    <div class="swatch light" style="background:var(--gray-3)"><span class="name">gray-3</span><span class="hex">#6B6760</span></div>
    <div class="swatch light" style="background:var(--ink)"><span class="name">ink</span><span class="hex">#1A1F2C</span></div>
  </div>
</body></html>
