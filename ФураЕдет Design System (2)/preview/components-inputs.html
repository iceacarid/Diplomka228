<!doctype html>
<html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { box-sizing: border-box; }
  body { background: var(--navy); padding: 20px; font-family: var(--font-body); margin: 0; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; align-items: start; }
  .field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .label { font-size: 9px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.32); }
  .field input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); color: white; padding: 12px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; font-family: var(--font-body); outline: none; }
  .field.focus input { border-color: var(--gold); background: rgba(255,255,255,0.08); box-shadow: 0 0 0 3px rgba(240,165,0,0.12); }

  .light { background: white; padding: 14px 16px 16px; border-radius: 10px; }
  .light .label { color: rgba(10,22,40,0.5); }
  .light input { background: white; color: var(--ink); border: 1.5px solid var(--gray-1); }
</style></head>
<body>
  <div class="row">
    <div class="field">
      <span class="label">Откуда</span>
      <input value="Москва" />
    </div>
    <div class="field focus">
      <span class="label">Куда · focused</span>
      <input value="Казань" />
    </div>
    <div class="field light">
      <span class="label">Email</span>
      <input value="you@example.com" />
    </div>
  </div>
</body></html>
