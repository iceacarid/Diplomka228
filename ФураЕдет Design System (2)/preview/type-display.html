<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: var(--navy); color: white; padding: 24px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .row:last-child { border: none; }
  .label { font-family: var(--font-mono); font-size: 10px; color: rgba(255,255,255,0.4); width: 110px; flex-shrink: 0; letter-spacing: 0.08em; }
</style></head>
<body>
  <div class="row"><span class="label">DISPLAY 1</span><span class="fe-display-3">ФУРА<span style="color:var(--gold)">ЕДЕТ</span></span></div>
  <div class="row"><span class="label">H1 / 38</span><span class="fe-h1">Логистика бизнеса</span></div>
  <div class="row"><span class="label">H2 / 28</span><span class="fe-h2">Автопарк и водители</span></div>
  <div class="row"><span class="label">EYEBROW</span><span class="fe-eyebrow" style="color:var(--gold)">Логистика нового поколения</span></div>
</body></html>
