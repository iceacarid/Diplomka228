<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing & Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #FBF9F4; padding: 24px; font-family: var(--font-body); display: flex; gap: 24px; }
  .col { flex: 1; }
  .title { font-family: var(--font-mono); font-size: 10px; color: var(--gray-2); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-family: var(--font-mono); font-size: 11px; color: var(--gray-3); }
  .bar { background: var(--gold); height: 12px; }
  .box { background: var(--navy); margin-right: 8px; }
</style></head>
<body>
  <div class="col">
    <div class="title">Spacing — 8pt</div>
    <div class="row"><div class="bar" style="width:4px"></div>4 / s-1</div>
    <div class="row"><div class="bar" style="width:8px"></div>8 / s-2</div>
    <div class="row"><div class="bar" style="width:16px"></div>16 / s-4</div>
    <div class="row"><div class="bar" style="width:24px"></div>24 / s-6</div>
    <div class="row"><div class="bar" style="width:48px"></div>48 / s-8</div>
    <div class="row"><div class="bar" style="width:80px"></div>80 / s-10</div>
  </div>
  <div class="col">
    <div class="title">Radii</div>
    <div class="row"><div class="box" style="width:24px;height:24px;border-radius:2px"></div>2 / r-1 (CTA)</div>
    <div class="row"><div class="box" style="width:24px;height:24px;border-radius:6px"></div>6 / r-2 (input)</div>
    <div class="row"><div class="box" style="width:24px;height:24px;border-radius:10px"></div>10 / r-3 (tile)</div>
    <div class="row"><div class="box" style="width:24px;height:24px;border-radius:14px"></div>14 / r-4 (card)</div>
    <div class="row"><div class="box" style="width:24px;height:24px;border-radius:20px"></div>20 / r-5 (hero)</div>
  </div>
</body></html>
