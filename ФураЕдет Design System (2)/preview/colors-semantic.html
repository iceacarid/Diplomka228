<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Semantic</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #FBF9F4; padding: 18px; font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .pair { background: white; border: 1px solid var(--gray-1); border-radius: 10px; overflow: hidden; }
  .top { padding: 14px; color: white; font-family: var(--font-mono); font-size: 11px; }
  .pill-row { padding: 14px; display: flex; align-items: center; gap: 8px; }
  .pill { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--gray-3); }
</style></head>
<body>
  <div class="grid">
    <div class="pair"><div class="top" style="background:var(--green)">#12B76A</div><div class="pill-row"><span class="pill" style="background:var(--green-bg);color:var(--green)">Доставлено</span></div></div>
    <div class="pair"><div class="top" style="background:var(--blue)">#2E90FA</div><div class="pill-row"><span class="pill" style="background:var(--blue-bg);color:var(--blue)">В пути</span></div></div>
    <div class="pair"><div class="top" style="background:var(--amber)">#F79009</div><div class="pill-row"><span class="pill" style="background:var(--amber-bg);color:var(--amber)">Ожидает</span></div></div>
    <div class="pair"><div class="top" style="background:var(--red)">#F04438</div><div class="pill-row"><span class="pill" style="background:var(--red-bg);color:var(--red)">Отклонено</span></div></div>
  </div>
</body></html>
