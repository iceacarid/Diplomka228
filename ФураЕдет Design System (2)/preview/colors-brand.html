<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Brand</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #FBF9F4; padding: 18px; }
  .row { display: flex; gap: 10px; }
  .swatch { flex: 1; border-radius: 10px; padding: 14px; height: 110px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-1); }
  .swatch .name { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: 0.06em; }
  .swatch .hex { font-family: var(--font-mono); font-size: 11px; font-weight: 500; }
  .light { color: var(--fg-1); }
  .dark { color: var(--ink); }
</style></head>
<body>
  <div class="row">
    <div class="swatch light" style="background:var(--navy-deep)"><span class="name">navy-deep</span><span class="hex">#060D1A</span></div>
    <div class="swatch light" style="background:var(--navy)"><span class="name">navy</span><span class="hex">#0A1628</span></div>
    <div class="swatch light" style="background:var(--navy-2)"><span class="name">navy-2</span><span class="hex">#0F2040</span></div>
    <div class="swatch light" style="background:var(--navy-3)"><span class="name">navy-3</span><span class="hex">#162B55</span></div>
    <div class="swatch dark" style="background:var(--gold)"><span class="name">gold</span><span class="hex">#F0A500</span></div>
    <div class="swatch dark" style="background:var(--gold-2)"><span class="name">gold-2</span><span class="hex">#FFB800</span></div>
  </div>
</body></html>
