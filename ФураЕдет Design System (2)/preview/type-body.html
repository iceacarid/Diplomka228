<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Body</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: white; color: var(--ink); padding: 24px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--gray-1); }
  .row:last-child { border: none; }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--gray-2); width: 110px; flex-shrink: 0; letter-spacing: 0.08em; }
</style></head>
<body>
  <div class="row"><span class="label">H3 / 18</span><span class="fe-h3">DM Sans Bold — section header inline</span></div>
  <div class="row"><span class="label">BODY / 15</span><span class="fe-body">DM Sans 400 — paragraph text and table cells</span></div>
  <div class="row"><span class="label">BODY-SM / 13</span><span class="fe-body-sm">Smaller body — captions, secondary info</span></div>
  <div class="row"><span class="label">CAPTION / 12</span><span class="fe-caption" style="color:var(--gray-3)">Captions and helper text</span></div>
  <div class="row"><span class="label">MONO / 12</span><span class="fe-mono" style="color:var(--gold)">FE-A8B3K2 · 25 000 ₽</span></div>
</body></html>
